name: Build & Deploy (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: [self-hosted, alpha]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Type-check and build
        run: npm run build

      - name: Deploy to the live dev app
        shell: powershell
        run: |
          $liveDir = "c:\US-PORTFOLIO-DASHBOARD\Develop\us-portfolio-dashboard"
          Set-Location $liveDir
          git fetch origin
          git reset --hard origin/develop
          npm install
          pm2 restart us-portfolio-server us-portfolio-client
